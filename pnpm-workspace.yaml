packages:
  - 'packages/*'
  - 'apps/*'

# Migrated from the repo's .npmrc, which pnpm 11 no longer reads: all three
# settings below had gone silently inert on the 9 -> 11 bump, and
# autoInstallPeers had reverted to its default of `true`. That matters here —
# packages/core and packages/testing keep explicit peer ranges spanning several
# majors on purpose (see the catalog note below), and auto-installing peers
# undoes exactly that.
autoInstallPeers: false
# Report unmet peer ranges as warnings, not install failures: the peer ranges
# below intentionally span multiple majors
strictPeerDependencies: false
# Allow workspace packages to be linked
linkWorkspacePackages: true

# pnpm's supply-chain policy, pinned rather than inherited, and exempting the
# packages this owner publishes. This block is contract item 10 of
# jperezmart/package-template, copied verbatim and not tailored per repo; the
# README there carries the four things the keys do not say for themselves.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@jperezmart/*'

# Centralized versions (pnpm catalog). Reference with "catalog:" in package.json.
# Peer-dependency ranges in packages/core and packages/testing stay explicit on
# purpose (they intentionally span multiple major versions).
catalog:
  # runtime — nest / casl
  '@casl/ability': ^7.0.0
  '@casl/react': ^7.0.0
  '@nestjs/cli': ^11.0.23
  '@nestjs/common': ^11.1.26
  '@nestjs/core': ^11.1.26
  '@nestjs/platform-express': ^11.1.26
  '@nestjs/testing': ^11.1.26
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  express: ^5.1.0
  # runtime — orpc / zod
  zod: ^4.4.3
  '@orpc/contract': ^1.14.6
  '@orpc/server': ^1.14.6
  '@orpc/nest': ^1.14.6
  '@orpc/client': ^1.14.6
  '@orpc/openapi': ^1.14.6
  '@orpc/openapi-client': ^1.14.6
  '@orpc/zod': ^1.14.6
  # runtime — react
  react: ^19.2.7
  react-dom: ^19.2.7
  '@tanstack/react-query': ^5.104.2
  '@tanstack/react-router': ^1.170.43
  '@tanstack/react-start': ^1.169.1
  # Exact: it peers on the exact @orpc/client version, so it moves with it.
  '@orpc/tanstack-query': 1.14.6
  # runtime — next.js (Pages Router)
  next: ^16.4.0
  # runtime — hono
  hono: ^4.13.13
  '@hono/node-server': ^2.1.5
  # build / tooling
  tsdown: ^0.22.2
  turbo: ^2.9.18
  typescript: ^6.0.3
  vite: ^8.0.16
  '@vitejs/plugin-react': ^6.0.2
  vitest: ^4.1.9
  '@vitest/coverage-v8': ^4.1.9
  # testing
  supertest: ^7.2.2
  '@ucast/mongo2js': ^2.0.0
  # Mutation testing: casl-core's gate in CI (see AGENTS.md § Checks).
  '@stryker-mutator/core': ^10.0.0
  '@stryker-mutator/typescript-checker': ^10.0.0
  '@stryker-mutator/vitest-runner': ^10.0.0
  # Encodes server function payloads in the TanStack Start examples' HTTP tests.
  seroval: ^1.6.9
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  jsdom: ^30.1.2
  # types
  '@types/node': ^24.13.2
  '@types/supertest': ^7.2.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  # Shared configuration, published from jperezmart/config, replacing the
  # packages/eslint-config and packages/typescript-config this repo vendored.
  # The plugins those pinned are gone from the catalog: most are now transitive
  # dependencies of @jperezmart/eslint-config, and two — eslint-plugin-turbo and
  # eslint-plugin-import — the published config drops outright. Neither was
  # doing anything: no turbo/* rule was ever enabled, and
  # import/no-extraneous-dependencies was already inert on ESLint 10.
  '@jperezmart/eslint-config': ^1.0.0
  '@jperezmart/prettier-config': ^1.0.0
  '@jperezmart/typescript-config': ^1.0.0
  # eslint + prettier
  eslint: ^10.3.0
  prettier: ^3.8.3
