# SCAFFOLDING — a starting point, not canon. Unlike release.yml, nothing is
# bound to this filename: rename it, rewrite it, or delete it entirely.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # reads devEngines.runtime
          cache: pnpm

      # CI does not publish: no id-token, no registry-url.
      - run: pnpm install --frozen-lockfile

      # ↓ your checks. Delete the ones you don't have.
      - run: pnpm check:manifests
      - run: pnpm check:registry
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # casl-core decides; every mutant its tests let live fails the PR.
      - run: pnpm --filter @jperezmart/casl-core mutate

  # nest-casl peers on @nestjs/* ^11 || ^12 and the catalog installs 12, so
  # this job rewrites the catalog to 11 and runs the Nest packages' checks
  # against it. The install cannot be frozen: the lockfile pins 12.
  nest-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # reads devEngines.runtime
          cache: pnpm

      - run: >-
          sed -E -i
          "s/^(  '@nestjs\/(common|core|platform-express|testing)'): .*/\1: ^11.0.0/"
          pnpm-workspace.yaml
      # Fails the job if the rewrite matched nothing, instead of testing 12 twice.
      - run: |
          grep -q "^  '@nestjs/core': \\^11" pnpm-workspace.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: >-
          pnpm turbo run typecheck test
          --filter=@jperezmart/nest-casl --filter=@jperezmart/nest-casl-testing
